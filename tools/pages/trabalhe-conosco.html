<!-- title: Trabalhe conosco | GHB -->
<!-- desc: Envie seu currículo e faça parte da equipe GHB. -->
<section class="page-hero has-photo">{{foto equipe decor eager class=ph-bg pos=50%/35%}}<div class="container">
  <nav class="crumb"><a href="{root}index.html">Home</a> › Trabalhe conosco</nav>
  <h1>Trabalhe conosco</h1><p>Engenheiros, técnicos, operadores e equipes de campo: construa sua carreira com segurança e propósito.</p>
</div></section>
<section class="section"><div class="container" style="max-width:760px"><div class="form-box">
  <form class="form" data-validate novalidate>
    <div class="row2"><div class="field"><label>Nome completo <span class="req">*</span></label><input name="nome" data-rule="required"><div class="msg"></div></div>
    <div class="field"><label>E-mail <span class="req">*</span></label><input name="email" type="email" data-rule="email"><div class="msg"></div></div></div>
    <div class="row2"><div class="field"><label>Telefone <span class="req">*</span></label><input name="tel" data-rule="tel"><div class="msg"></div></div>
    <div class="field"><label>Área de interesse <span class="req">*</span></label><select name="area" data-rule="required"><option value="">Selecione…</option><option>Engenharia / Técnico</option><option>Operação de equipamentos</option><option>Equipe de campo</option><option>SSMA</option><option>Administrativo</option></select><div class="msg"></div></div></div>
    <div class="field"><label>Currículo (PDF)</label><input type="file" accept=".pdf"></div>
    <label class="consent"><input type="checkbox" name="lgpd"> Autorizo o tratamento dos meus dados para fins de recrutamento, conforme a <a href="{root}politicas.html#lgpd">LGPD</a>.</label>
    <button class="btn btn-primary" style="justify-content:center">Enviar currículo</button>
  </form>
  <div class="form-success"><h3>Currículo recebido!</h3><p>Ele ficará em nosso banco de talentos por 12 meses.</p></div>
</div></div></section>
